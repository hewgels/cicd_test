
name: Python CI

# Define when this workflow should run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # Run on a clean, standard Linux virtual machine provided by GitHub
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python on the virtual machine
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # Caches dependencies to speed up future runs

    # 3. Install your project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run your tests using pytest
    - name: Run pytest
      run: |
        pytest